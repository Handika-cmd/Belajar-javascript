<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Penilaian Kelas PAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box">
    <h2>📊 Penilaian Kelas PAI</h2>
    
    <label>Nama Mahasiswa</label>
    <input type="text" id="nama" placeholder="Contoh: Ahmad">
    
    <label>Nilai Tugas</label>
    <input type="number" id="tugas" placeholder="0-100">
    
    <label>Nilai UTS</label>
    <input type="number" id="uts" placeholder="0-100">
    
    <label>Nilai UAS</label>
    <input type="number" id="uas" placeholder="0-100">
    
    <button id="btnHitung">Hitung Nilai Akhir</button>
    
    <div id="output">Hasil akan muncul di sini...</div>
  </div>

  <script src="js.js"></script>
</body>
</html>
